name: Deploy Monorepo Subdomain to cPanel via FTP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # -------------------------------------------------------------
      # 1. BUILD FRONTEND (Inject Env dari GitHub Secrets)
      # -------------------------------------------------------------
      - name: Build Frontend (Vite)
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_PRIVY_APP_ID: ${{ secrets.VITE_PRIVY_APP_ID }}
          VITE_ESCROW_CONTRACT_ADDRESS: ${{ secrets.VITE_ESCROW_CONTRACT_ADDRESS }}
          VITE_STABLECOIN_ADDRESS: ${{ secrets.VITE_STABLECOIN_ADDRESS }}
          VITE_MIDTRANS_CLIENT_KEY: ${{ secrets.VITE_MIDTRANS_CLIENT_KEY }}
          VITE_MIDTRANS_IS_PRODUCTION: ${{ secrets.VITE_MIDTRANS_IS_PRODUCTION }}
        run: |
          cd frontend
          npm ci
          npm run build

      # -------------------------------------------------------------
      # 2. BUILD BACKEND (Compile TS ke dist/ & Generate Prisma)
      # -------------------------------------------------------------
      - name: Build Backend (TypeScript & Prisma)
        run: |
          cd backend
          npm ci
          npx prisma generate
          npm run build

      # -------------------------------------------------------------
      # 3. NORMALIZE HOSTNAME FTP
      # -------------------------------------------------------------
      - name: Normalize FTP Server Host
        id: ftp-server
        env:
          FTP_SERVER_RAW: ${{ secrets.FTP_SERVER }}
        run: |
          ftp_host="$(printf '%s' "$FTP_SERVER_RAW" | tr -d '\r\n' | xargs)"
          ftp_host="${ftp_host#\"}"
          ftp_host="${ftp_host%\"}"
          ftp_host="${ftp_host#\'}"
          ftp_host="${ftp_host%\'}"
          ftp_host="$(printf '%s' "$ftp_host" | sed -E 's#^[[:alpha:]][[:alnum:]+.-]*://##')"
          ftp_host="${ftp_host##*@}"
          ftp_host="${ftp_host%%/*}"
          ftp_host="${ftp_host%%:*}"
          if [ -z "$ftp_host" ]; then
            echo "FTP_SERVER is empty after normalization" >&2
            exit 1
          fi
          echo "server=$ftp_host" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------------
      # 4. DEPLOY FRONTEND (Hanya kirim isi folder dist)
      # -------------------------------------------------------------
      - name: FTP Deploy Frontend
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ steps.ftp-server.outputs.server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend/dist/
          server-dir: /midtract.dbx.web.id/
          dangerous-clean-slate: false
          sftp: false
          security: loose
          timeout: 60000

      - name: Wait before backend deployment
        run: sleep 10

      # -------------------------------------------------------------
      # 5. DEPLOY BACKEND (Kirim dist, package.json, dan .prisma)
      # -------------------------------------------------------------
      - name: FTP Deploy Backend
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ steps.ftp-server.outputs.server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend/
          server-dir: /api_midtract/
          # Abaikan semua node_modules KECUALI folder .prisma
          # Abaikan src/ dan file konfigurasi TypeScript lokal
          exclude: |
            **/src/**
            **/.git*
            **/.git*/**
            **/node_modules/!(.prisma)
            **/node_modules/!(.prisma)/**
            .env
            tsconfig.json
            README.md
          dangerous-clean-slate: false
          sftp: false
          security: loose
          timeout: 60000