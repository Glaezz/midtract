name: Deploy Monorepo Subdomain to cPanel via FTP

# Required repository secrets for SSH/SFTP deployment:
# - SSH_HOST: SSH/SFTP server host (can include scheme/path; workflow normalizes it)
# - SSH_PORT: SSH port (optional; defaults to 22)
# - SSH_USERNAME: SSH user for deployment
# - SSH_PRIVATE_KEY: private key (PEM/OpenSSH format) for SSH authentication
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # 1. Build Frontend dengan Environment Variable API Backend
      - name: Build Frontend (Vite)
        env:
          VITE_API_BASE_URL: "https://api.midtract.dbx.web.id/api"
        run: |
          cd frontend
          npm ci
          npm run build

      # 2. Install Dependencies Backend
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci --production

      - name: Normalize SSH Connection Inputs
        id: ssh-conn
        env:
          SSH_HOST_RAW: ${{ secrets.SSH_HOST }}
          SSH_PORT_RAW: ${{ secrets.SSH_PORT }}
        run: |
          ssh_host="$(printf '%s' "$SSH_HOST_RAW" | tr -d '\r\n' | xargs)"
          ssh_host="${ssh_host#\"}"
          ssh_host="${ssh_host%\"}"
          ssh_host="${ssh_host#\'}"
          ssh_host="${ssh_host%\'}"
          ssh_host="$(printf '%s' "$ssh_host" | sed -E 's#^[[:alpha:]][[:alnum:]+.-]*://##')"
          ssh_host="${ssh_host##*@}"
          ssh_host="${ssh_host%%/*}"
          ssh_host="${ssh_host%%:*}"
          if [ -z "$ssh_host" ]; then
            echo "SSH_HOST is empty after normalization" >&2
            exit 1
          fi
          ssh_port="$(printf '%s' "$SSH_PORT_RAW" | tr -d '\r\n' | xargs)"
          if [ -z "$ssh_port" ]; then
            ssh_port="22"
          fi
          if ! [[ "$ssh_port" =~ ^[0-9]+$ ]]; then
            echo "SSH_PORT must be numeric" >&2
            exit 1
          fi
          echo "host=$ssh_host" >> "$GITHUB_OUTPUT"
          echo "port=$ssh_port" >> "$GITHUB_OUTPUT"

      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add SSH Host Key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${{ steps.ssh-conn.outputs.port }}" "${{ steps.ssh-conn.outputs.host }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # 3. SFTP Deploy Frontend ke Folder Subdomain Frontend
      - name: SFTP Deploy Frontend
        run: |
          rsync -az \
            --omit-dir-times \
            --no-perms \
            --no-owner \
            --no-group \
            -e "ssh -p ${{ steps.ssh-conn.outputs.port }}" \
            ./frontend/dist/ \
            "${{ secrets.SSH_USERNAME }}@${{ steps.ssh-conn.outputs.host }}:/midtract.dbx.web.id/"

      - name: Wait before backend deployment
        run: sleep 15

      # 4. SFTP Deploy Backend ke Folder Application Root Node.js
      - name: SFTP Deploy Backend
        run: |
          rsync -az \
            --omit-dir-times \
            --no-perms \
            --no-owner \
            --no-group \
            --exclude '.git*' \
            --exclude 'node_modules/' \
            --exclude '.env' \
            -e "ssh -p ${{ steps.ssh-conn.outputs.port }}" \
            ./backend/ \
            "${{ secrets.SSH_USERNAME }}@${{ steps.ssh-conn.outputs.host }}:/api_midtract/"
