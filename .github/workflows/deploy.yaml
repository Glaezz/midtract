name: Deploy Monorepo Subdomain to cPanel via FTP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # 1. Build Frontend dengan Environment Variable API Backend
      - name: Build Frontend (Vite)
        env:
          VITE_API_BASE_URL: "https://api.midtract.dbx.web.id/api"
        run: |
          cd frontend
          npm ci
          npm run build

      # 2. Install Dependencies Backend
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci --production

      # 3. FTP Deploy Frontend ke Folder Subdomain Frontend
      - name: FTP Deploy Frontend
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend/dist/
          server-dir: /midtract.dbx.web.id/
          dangerous-clean-slate: false

      # 4. FTP Deploy Backend ke Folder Application Root Node.js
      - name: FTP Deploy Backend
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend/
          server-dir: /api_midtract/ # Arahkan ke Application Root Node.js cPanel
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
