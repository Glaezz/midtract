name: Deploy Monorepo Subdomain to cPanel via FTP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Build Frontend (Vite)
        env:
          VITE_API_BASE_URL: "https://api.midtract.dbx.web.id/api"
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci --production

      - name: Normalize FTP Server Host
        id: ftp-server
        env:
          FTP_SERVER_RAW: ${{ secrets.FTP_SERVER }}
        run: |
          ftp_host="$(printf '%s' "$FTP_SERVER_RAW" | tr -d '\r\n' | xargs)"
          ftp_host="${ftp_host#\"}"
          ftp_host="${ftp_host%\"}"
          ftp_host="${ftp_host#\'}"
          ftp_host="${ftp_host%\'}"
          ftp_host="$(printf '%s' "$ftp_host" | sed -E 's#^[[:alpha:]][[:alnum:]+.-]*://##')"
          ftp_host="${ftp_host##*@}"
          ftp_host="${ftp_host%%/*}"
          ftp_host="${ftp_host%%:*}"
          if [ -z "$ftp_host" ]; then
            echo "FTP_SERVER is empty after normalization" >&2
            exit 1
          fi
          echo "server=$ftp_host" >> "$GITHUB_OUTPUT"

      # Deploy Frontend dengan Retry
      - name: FTP Deploy Frontend
        uses: nick-invision/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            npx ftp-deploy --server ${{ steps.ftp-server.outputs.server }} \
              --username ${{ secrets.FTP_USERNAME }} \
              --password ${{ secrets.FTP_PASSWORD }} \
              --local-dir ./frontend/dist/ \
              --server-dir /midtract.dbx.web.id/ \
              --exclude "**/.git*,**/node_modules/**,.env"

      # Delay antara deploy frontend dan backend untuk menghindari connection reset
      - name: Wait before backend deployment
        run: sleep 10

      # Deploy Backend dengan Retry
      - name: FTP Deploy Backend
        uses: nick-invision/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            npx ftp-deploy --server ${{ steps.ftp-server.outputs.server }} \
              --username ${{ secrets.FTP_USERNAME }} \
              --password ${{ secrets.FTP_PASSWORD }} \
              --local-dir ./backend/ \
              --server-dir /api_midtract/ \
              --exclude "**/.git*,**/node_modules/**,.env"
